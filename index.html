<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Say it! Práctica de pronunciación en inglés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3d1;--card:#fffdf6;--ink:#3a2468;--mute:#7d6a9e;--line:#ffd98a;--pri:#ff4f93;--pri-d:#c92a6c;--sun:#ffd23f;--sun-d:#e0a400;--ok:#12b76a;--ok-bg:#d3f7e4;--bad:#ff5a4e;--bad-bg:#ffdcd8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b1a5a;--card:#3b2778;--ink:#fff4dc;--mute:#cdbbf5;--line:#5a3fa3;--pri:#ff7bb0;--pri-d:#d64a86;--ok:#5cf0ac;--ok-bg:#16543c;--bad:#ff8f86;--bad-bg:#5c2437;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2b1a5a;--card:#3b2778;--ink:#fff4dc;--mute:#cdbbf5;--line:#5a3fa3;--pri:#ff7bb0;--pri-d:#d64a86;--ok:#5cf0ac;--ok-bg:#16543c;--bad:#ff8f86;--bad-bg:#5c2437;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600}
body{min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:18px}
.brand{font-weight:900;font-size:24px;letter-spacing:-.5px;color:var(--pri)}
.stats{display:flex;gap:8px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px;white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px 18px;font-weight:900;font-size:17px;background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-d)}
.btn.alt{background:var(--card);color:var(--pri);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sun{background:var(--sun);color:#3b2a00;box-shadow:0 4px 0 var(--sun-d)}
.btn[disabled]{opacity:.5;pointer-events:none}
h1{font-size:28px;margin:0 0 6px;font-weight:900;letter-spacing:-.5px}
.sub{color:var(--mute);margin:0 0 20px;line-height:1.45}
.unit{display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;text-align:left;width:100%;box-shadow:0 4px 0 var(--line)}
.unit:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.badge{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:900;background:var(--sun);color:#3b2a00}
.unit.done .badge{background:var(--ok);color:#fff}
.unit b{display:block;font-size:18px}
.unit small{color:var(--mute);font-size:14px;font-weight:600}
.ipa-sample{font-family:"Nunito","Segoe UI","Noto Sans","DejaVu Sans",sans-serif}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .35s}
.head{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.x{border:0;background:none;font-size:26px;color:var(--mute);padding:0 4px}
.q{font-size:20px;font-weight:800;margin:0 0 16px}
.stage{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:24px 18px;text-align:center;margin-bottom:16px}
.word{font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1.1;margin:0}
.ipa{font-family:"Nunito","Segoe UI","Noto Sans","DejaVu Sans",sans-serif;font-size:30px;color:var(--pri);font-weight:800;margin:10px 0 4px;word-break:break-word}
.es{color:var(--mute);font-size:17px;margin:0}
.row{display:flex;gap:10px;margin:14px 0}
.row .btn{flex:1;padding:12px 10px;font-size:15px}
.speaker{width:92px;height:92px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:38px;box-shadow:0 5px 0 var(--pri-d);margin:6px auto 10px;display:grid;place-items:center}
.speaker:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pri-d)}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--sun);color:#3b2a00;font-size:40px;box-shadow:0 5px 0 var(--sun-d);display:grid;place-items:center;margin:6px auto}
.mic.rec{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}*{transition:none!important}}
.opt{display:block;width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;font-size:26px;font-weight:800;color:var(--ink);box-shadow:0 4px 0 var(--line);font-family:"Nunito","Segoe UI","Noto Sans","DejaVu Sans",sans-serif}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);box-shadow:0 4px 0 var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad);color:var(--bad)}
.fb{border-radius:18px;padding:16px;margin-top:14px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb b{font-size:19px;display:block;margin-bottom:4px}
.fb p{margin:0 0 12px;color:var(--ink);font-size:15px}
.hint{color:var(--mute);font-size:14px;text-align:center;margin:8px 0}
.big{font-size:64px;margin:10px 0}
.res{display:flex;gap:10px;margin:20px 0}
.res div{flex:1;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.res b{display:block;font-size:24px}
.res span{color:var(--mute);font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.tbl .ipa-sample{color:var(--pri);font-weight:800}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:14px;display:block;margin:6px auto}
.head .chip{font-size:13px;padding:3px 10px}
.nav{display:flex;gap:10px;margin-top:16px}.nav .btn{flex:1;padding:11px;font-size:15px}
.help{margin-top:6px;text-align:center}.help img{width:100%;border-radius:14px;border:2px solid var(--line);background:#fff}
.help p{font-size:14px;color:var(--mute);margin:8px 0 0;line-height:1.4}
[hidden]{display:none!important}
body{background:linear-gradient(180deg,var(--bg),var(--bg)) fixed}
.unit[data-u="0"] .badge{background:#7be495;color:#12391f}
.unit[data-u="1"] .badge{background:#56d0f5;color:#08354a}
.unit[data-u="2"] .badge{background:#ffab3d;color:#4a2a00}
.unit[data-u="3"] .badge{background:#c98bff;color:#33105c}
.unit.done[data-u] .badge{background:var(--ok);color:#fff}
.unit{border-radius:22px}
.stage{border-color:var(--sun);border-width:3px}
.chip{border-color:var(--sun)}
.bar i{background:linear-gradient(90deg,#ffd23f,#ff4f93)}
.opt:active,.opt:hover{border-color:var(--pri)}
.modal{position:fixed;inset:0;background:rgba(43,26,90,.6);display:grid;place-items:center;padding:20px;z-index:50}
.modal .box{background:var(--card);border:3px solid var(--sun);border-radius:24px;padding:24px 20px;max-width:420px;width:100%;text-align:center}
.hit{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.hit{animation:none}}
.row .btn{min-width:0}
</style>
</head>

  </div>
  <div id="app"></div>
</div>

// ---------- audio ----------
function speak(t,r=.9){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=r;
  const v=speechSynthesis.getVoices().find(v=>/^en[-_]US/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}
}
if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=()=>{};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i]}for(let j=0;j<=b.length;j++)m[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 return m[a.length][b.length]}
const sim=(a,b)=>{a=norm(a);b=norm(b);return 1-lev(a,b)/Math.max(a.length,b.length,1)};

function testMic(){
  const m=$("#micMsg");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){m.textContent="Este navegador no permite usar el micrófono aquí.";return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{s.getTracks().forEach(t=>t.stop());m.textContent=SR?"✅ Micrófono listo. ¡Ya puedes practicar!":"Micrófono permitido, pero este navegador no reconoce voz. Usa Chrome o Edge."})

}

}
// la velocidad sube a lo largo del nivel y entre niveles
function rate(){const u=L.u,lo=Math.min(.55+.1*u,1),hi=Math.min(.8+.07*u,1),n=Math.max(L.n-1,1);return +(lo+(hi-lo)*Math.min(L.i,n)/n).toFixed(2)}
function head(){
  return `<div class="head"><button class="x" id="bX" aria-label="Salir">✕</button><div class="bar"><i style="width:${L.i/L.q.length*100}%"></i></div><span class="chip">🎧 ${rate()}×</span></div>`;
}
function nav(){return `<div class="nav"><button class="btn alt" id="bBack" ${L.i===0?"disabled":""}>← Atrás</button><button class="btn alt" id="bSkip">Saltar →</button></div>`}
function step(){
  if(L.hearts<=0)return end(false);
  if(L.i>=L.q.length)return end(true);
  const e=L.q[L.i];
  e.t==="ipa"?exIpa(e.w):exSay(e.w);
  $("#bX").onclick=confirmExit;
  $("#bBack").onclick=()=>{if(L.i>0){L.i--;step()}};
  $("#bSkip").onclick=()=>{if(!L.ans[L.i]&&!e.rq)L.q.push({t:e.t,w:e.w,rq:1});next()};
}
function confirmExit(){
  const m=document.createElement("div");m.className="modal";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");
  m.innerHTML=`<div class="box"><div style="font-size:44px;margin-bottom:6px">🚪</div><p class="ipa" style="font-size:32px;margin:0 0 4px">/du ju wɑnt tu ˈɛɡzɪt/?</p><button class="link" id="eHear">🔊 Listen</button><div class="row"><button class="btn alt" id="eYes">Yes /jɛs/</button><button class="btn sun" id="eNo">No /noʊ/</button></div></div>`;
  document.body.appendChild(m);
  const close=()=>m.remove();
  m.querySelector("#eHear").onclick=()=>speak("Do you want to exit?",.8);
  m.querySelector("#eNo").onclick=close;
  m.querySelector("#eYes").onclick=()=>{close();home()};
  m.querySelector("#eNo").focus();
  speak("Do you want to exit?",.8);
}
function next(){L.i++;step()}
function feedback(good,w,retry){
  let gain=0;
  if(!good)L.hearts=Math.max(0,L.hearts-1);
  if(!L.ans[L.i]){L.ans[L.i]=1;L.tot++;if(good){L.ok++;L.xp+=10;S.xp+=10;gain=10;save()}}
  hud();
  const sk=$("#bSkip");if(sk)sk.style.visibility="hidden";
  if(!good){const h=$("#sHeart");h.classList.remove("hit");void h.offsetWidth;h.classList.add("hit")}
  const box=$("#fb");
  box.className="fb "+(good?"ok":"bad");
  box.innerHTML=`<b>${good?"¡Excelente!"+(gain?" +10 ⭐":""):(L.hearts>0?"Incorrecto: perdiste 1 ❤️. ¡Inténtalo de nuevo!":"Incorrecto: perdiste tu último ❤️.")}</b>${good?`<p><b>${w.en}</b> → /${w.ipa}/ · ${w.es}</p>`:""}
   ${!good&&retry&&L.hearts>0?`<button class="btn sun" id="bRetry" style="margin-bottom:10px">Intentar de nuevo</button>`:""}
   <button class="btn ${good?"":"alt"}" id="bNext">Continuar</button>`;
  $("#bNext").onclick=next;
  const r=$("#bRetry");if(r)r.onclick=retry;
}

// Ejercicio 1: escucha y elige la IPA
function exIpa(w){
  const rt=rate();
  const pool=W.filter(x=>x.ipa!==w.ipa);
  const opts=shuffle([w,...shuffle(pool).slice(0,2)]);
  app.innerHTML=head()+`<p class="q">Escucha y elige la transcripción IPA</p>
  <div class="stage"><button class="speaker" id="bPlay" aria-label="Escuchar">🔊</button>
  <button class="link" id="bSlow">🐢 Más lento</button></div>
  ${opts.map((o,i)=>`<button class="opt" data-i="${i}">/${o.ipa}/</button>`).join("")}
  <div id="fb"></div>`+nav();
  $("#bPlay").onclick=()=>speak(w.say,rt);
  $("#bSlow").onclick=()=>speak(w.say,.5);
  setTimeout(()=>speak(w.say,rt),300);
  let done=false;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(done)return;done=true;
    const o=opts[+b.dataset.i],good=o.ipa===w.ipa;
    b.classList.add(good?"ok":"bad");
    feedback(good,w,()=>step());
  });
}

// Ayuda: diagrama de articulación
function helpHTML(w){
  const src=w.im?w:W.find(x=>x.en===w.like&&x.im);
  const img=src&&IMG[src.im];
  if(!img)return `<p>No hay diagrama para esta palabra.</p>`;
  return `<img src="${img}" alt="Diagrama sagital del tracto vocal para ${src.en}">
  <p>${w.im?`Diagrama de <b>${w.en}</b> /${w.ipa}/.`:`Esta palabra comparte sonidos con <b>${src.en}</b> /${src.ipa}/. Observa el diagrama.`} Fíjate en dónde toca la lengua, qué hacen los labios y por dónde sale el aire.</p>`;
}

// Ejercicio 2: repetir en voz alta
function exSay(w){
  const rt=rate();
  app.innerHTML=head()+`<p class="q">Escucha y repite en voz alta</p>
  <div class="stage"><p class="word">${w.en}</p><p class="ipa">/${w.ipa}/</p><p class="es">${w.es}</p>
  <div class="row"><button class="btn alt" id="bPlay">🔊 Escuchar</button><button class="btn alt" id="bSlow">🐢 Lento</button><button class="btn alt" id="bHelp">💡 Ayuda</button></div>
  <div class="help" id="help" hidden>${helpHTML(w)}</div></div>
  <button class="mic" id="bMic" aria-label="Hablar">🎤</button>
  <p class="hint" id="mh">${SR?"Toca el micrófono y di la palabra":"Tu navegador no tiene reconocimiento de voz. Autoevalúate."}</p>
  <div id="self" style="display:none"></div>
  <button class="link" id="bSelf" style="display:${SR?"block":"none"}">¿No funciona el micrófono? Autoevaluarme</button>
  <div id="fb"></div>`+nav();
  $("#bPlay").onclick=()=>speak(w.say,rt);
  $("#bSlow").onclick=()=>speak(w.say,.5);
  $("#bHelp").onclick=()=>{const h=$("#help");h.hidden=!h.hidden};
  setTimeout(()=>speak(w.say,rt),300);
  let finished=false;
  const retry=()=>exSayAgain(w);
  const fin=g=>{if(finished)return;finished=true;$("#bMic").disabled=true;$("#self").innerHTML="";$("#bSelf").style.display="none";feedback(g,w,retry)};
  const self=()=>{const s=$("#self");s.style.display="block";s.innerHTML=`<div class="row"><button class="btn alt" id="sBad">Necesito practicar</button><button class="btn sun" id="sOk">Lo dije bien</button></div>`;
    $("#sBad").onclick=()=>fin(false);$("#sOk").onclick=()=>fin(true)};
  if(!SR)self();
  $("#bSelf").onclick=self;
  const thr=.72+.02*L.u;
  $("#bMic").onclick=()=>{
    if(finished||!SR)return;
    const mic=$("#bMic");
    try{
      speechSynthesis.cancel();
      const r=new SR();r.lang="en-US";r.maxAlternatives=5;r.interimResults=false;
      r.onstart=()=>{mic.classList.add("rec");$("#mh").textContent="Te escucho…"};
      r.onresult=ev=>{mic.classList.remove("rec");
        const alts=[...ev.results[0]].map(a=>a.transcript);
        const best=Math.max(...alts.map(a=>sim(a,w.say)));
        $("#mh").textContent="Escuché: “"+alts[0]+"”";
        fin(best>=thr)};
      r.onerror=ev=>{mic.classList.remove("rec");
        if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){$("#mh").textContent="El micrófono está bloqueado en esta página. Permítelo en el candado de la barra de direcciones, abre el juego en su propia pestaña o usa el archivo descargado. Mientras tanto, autoevalúate.";self()}
        else if(ev.error==="no-speech"){$("#mh").textContent="No te escuché. Inténtalo de nuevo."}
        else{$("#mh").textContent="No pude escucharte ("+ev.error+"). Inténtalo otra vez o autoevalúate."}};
      r.onend=()=>mic.classList.remove("rec");
      r.start();
    }catch(err){$("#mh").textContent="No se pudo iniciar el micrófono.";self()}
  };
}
function exSayAgain(w){step()}

// ---------- final ----------
function end(win){
  const acc=L.tot?Math.round(L.ok/L.tot*100):0;
  if(win){
    if(!S.done.includes(L.u))S.done.push(L.u);
    const t=new Date().toDateString();
    if(S.last!==t){const y=new Date(Date.now()-864e5).toDateString();S.streak=S.last===y?S.streak+1:1;S.last=t}
    save();
  }
  const xp=L.xp,u=L.u,more=win&&u<UNITS.length-1;
  app.innerHTML=`<div style="text-align:center"><div class="big">${win?"🎉":"💔"}</div>
  <h1>${win?"¡Lección completada!":"Te quedaste sin corazones"}</h1>
  <p class="sub">${win?(more?"Prueba el siguiente nivel: más rápido y con palabras más largas.":"Terminaste todos los niveles."):"No pasa nada: repite la lección y escucha con calma."}</p>
  <div class="res"><div><b>+${xp}</b><span>estrellas</span></div><div><b>${acc}%</b><span>precisión</span></div><div><b>${S.streak||0}</b><span>días seguidos</span></div></div>
  ${more?`<button class="btn" id="bNextU">Siguiente nivel</button><button class="btn alt" id="bAgain" style="margin-top:12px">Practicar de nuevo</button>`:`<button class="btn" id="bAgain">${win?"Practicar de nuevo":"Reintentar"}</button>`}
  <button class="btn alt" id="bHome" style="margin-top:12px">Volver al inicio</button></div>`;
  L=null;hud();
  $("#bAgain").onclick=()=>start(u);
  const n=$("#bNextU");if(n)n.onclick=()=>start(u+1);
  $("#bHome").onclick=home;
}
home();
</script>
</body>
</html>
